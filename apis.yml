aid: hevy
name: Hevy
description: >-
  Hevy is a gym workout tracker and planner app for iOS, Android and the web, operated by Hevy Studios,
  S.L. and used by a community the company describes as 15+ million lifters. Members log strength-training
  sessions, build and reuse routines, organize them into folders, browse a large exercise library, and
  track body measurements and progress over time. Hevy also runs Hevy Coach, a separate product for
  personal trainers who program and monitor client training. For developers, Hevy Pro subscribers can mint
  an API key in the web app and call a public REST API at api.hevyapp.com covering workouts, a workout
  change-feed, routines, routine folders, exercise templates, exercise history, body measurements and
  account info. The company also publishes a first-party ChatGPT Custom GPT ("Hevy - Gym workout planner")
  whose OAuth-authenticated action spec it keeps in its own GitHub organization.
