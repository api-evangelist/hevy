apis:
- name: Hevy Public API
  description: >-
    Public REST API for Hevy Pro accounts. 22 operations across workouts (list, create, update, count and a
    since-based change feed of updates and deletes), routines, routine folders, exercise templates, exercise
    history and body measurements, plus account info. Authenticated with a per-account UUID API key sent in
    the api-key request header; page/pageSize pagination on every collection.
  humanURL: https://api.hevyapp.com/docs
  baseURL: https://api.hevyapp.com
