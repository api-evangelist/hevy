- name: Hevy GPT Action API
  description: >-
    OAuth-authenticated action surface behind Hevy's first-party ChatGPT Custom GPT, "Hevy - Gym workout
    planner". Six operations (list workouts, list/create routines, list/create routine folders, exercise
    history) served from hevy.com/api/v1 rather than api.hevyapp.com. Hevy publishes the OpenAPI 3.1.0
    action schema in its own GitHub organization at github.com/hevyapp/hevy-gpt.
  humanURL: https://github.com/hevyapp/hevy-gpt
  baseURL: https://hevy.com/api/v1
