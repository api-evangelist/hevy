    api.hevyapp.com serves a valid OpenAPI 3.0.0 document (22 operations, 28 schemas) embedded in
    https://api.hevyapp.com/docs/swagger-ui-init.js and rendered by Swagger UI at
    https://api.hevyapp.com/docs. Captured to openapi/hevy-public-api-openapi.json.
  caveat: >-
    The spec is NOT served at a stable machine-readable URL. /openapi.json, /swagger.json, /docs-json,
    /docs-yaml and /api-docs all 404 on the API host; the only copy is inside the Swagger UI
    bootstrap JavaScript. A machine consumer has to scrape a JS file to get the contract.
- id: openapi-3.1
  conforms: true
