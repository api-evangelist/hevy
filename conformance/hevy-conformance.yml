  ETag/conditional requests — is absent. No compliance certification (SOC 2, ISO 27001, HIPAA, GDPR
  attestation) is published anywhere on the company's sites, so NO Compliance pointer is emitted.
standards:
- id: openapi-3.0
  conforms: true
