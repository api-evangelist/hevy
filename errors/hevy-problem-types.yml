source: >-
  Derived from the 4xx/5xx responses declared across the 22 operations in
  openapi/hevy-public-api-openapi.json, plus a live unauthenticated probe of
  https://api.hevyapp.com/v1/workouts on 2026-08-27.
summary: >-
  Hevy declares 27 error responses across 22 operations, but every one of them is a bare status code
  and a one-line English description — no schema, no content block, no media type, no error code and
  no machine-readable body. There is no error envelope to parse. Clients must branch on the HTTP
  status and, where two errors share a status on the same operation (400 has several meanings), on
  the operation being called.
envelope:
  structured: false
  media_type_declared: none
  observed_media_type: text/html; charset=utf-8
  observed_body: InvalidApiKey
  observed_status: 401
  observed_on: GET https://api.hevyapp.com/v1/workouts with an unissued UUID, 2026-08-27
  note: >-
    The live 401 is not declared on ANY operation in the spec, and it returns a bare unquoted string
    with an HTML content type. A client that calls response.json() on a Hevy error will throw. Hevy's
    own hevy.com/api/v1 proxy demonstrates the bug: it returns
    {"error":"Internal Server Error","details":"Unexpected token 'I', \"InvalidApiKey\" is not valid
    JSON"} — the proxy tried to parse its own upstream error and failed.
