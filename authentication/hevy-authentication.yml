    checked: '2026-08-27'
mtls: false
openid_connect: false
signed_requests: false
cors:
  allow_origin: '*'
  allow_headers: Origin, X-Requested-With, Content-Type, Accept, api-key
  allow_methods: GET, POST, PUT, PATCH, DELETE, OPTIONS
  method: probed
  note: >-
    Observed on the live 401 from api.hevyapp.com. The API key is a bearer-equivalent secret and the
    API sets Access-Control-Allow-Origin `*`, so browser-side use of a Hevy key exposes it to any
    origin; keys belong on a server.
agent_notes: >-
  For an autonomous agent the only reachable door is the api-key header, and it cannot be obtained
  programmatically — a human must hold a Hevy Pro subscription and copy the key out of the web app.
  There is no OAuth flow an arbitrary client can complete, no scopes, and no way to issue a
  reduced-privilege credential: one key grants full read AND write over the whole account.
