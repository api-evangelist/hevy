source: >-
  https://api.hevyapp.com/docs (Swagger UI; the OpenAPI document is embedded in
  /docs/swagger-ui-init.js) + https://github.com/hevyapp/hevy-gpt + live probes of
  https://api.hevyapp.com/v1/workouts and https://hevy.com/oauth/authorize on 2026-08-27.
summary: >-
  Hevy runs two distinct authenticated surfaces. The public REST API on api.hevyapp.com takes a
  per-account UUID API key in an `api-key` request header, issued to Hevy Pro subscribers from the web
  app at https://hevy.com/settings?developer. Hevy's own ChatGPT Custom GPT calls a different host,
  hevy.com/api/v1, over OAuth 2.0 — the authorization endpoint https://hevy.com/oauth/authorize is
  live (307 to /login when unauthenticated) — but Hevy publishes no OAuth client registration flow,
  token endpoint, or scope reference, so OAuth is in practice a first-party-only surface.
schemes:
- id: api-key-header
  type: apiKey
  in: header
  name: api-key
  format: uuid
  applies_to: https://api.hevyapp.com (all 22 operations)
  declared_as_security_scheme: false
  declared_note: >-
    IMPORTANT SPEC GAP — the published OpenAPI declares NO `components.securitySchemes` and no
    `security` block anywhere. The key is modelled instead as a `required: true` header PARAMETER
    named `api-key` (schema type string, format uuid) repeated on all 22 operations. Functionally
    identical for a human reader; invisible to any tool that reads securitySchemes, including
    most codegen and every scorer that checks "securitySchemes defined + applied". Our overlay
    (overlays/hevy-public-api-overlay.yaml) proposes the missing ApiKeyAuth scheme.
  issuance:
    self_serve: true
    url: https://hevy.com/settings?developer
    gate: Hevy Pro subscription required
    probed:
    - url: https://hevy.com/settings?developer
      status: 200
      note: 302/307s to /login?postLoginPath=%2Fsettings%3Fdeveloper%3D for anonymous callers.
  rotation_documented: false
  expiry_documented: false
  scopes: none
  transport: HTTPS only (TLSv1.3 observed)
  failure:
    status: 401
    body: InvalidApiKey
    media_type: text/html; charset=utf-8
    note: >-
      Observed live 2026-08-27 with a syntactically valid but unissued UUID. The body is the bare
      string `InvalidApiKey` with a text/html content type — not JSON, not RFC 9457, and not declared
      anywhere in the OpenAPI (no operation declares a 401). See errors/hevy-problem-types.yml.
- id: oauth2-gpt-action
  type: oauth2
  flow: authorization_code
  applies_to: https://hevy.com/api/v1 (6 operations, Hevy's own ChatGPT Custom GPT)
  authorization_endpoint: https://hevy.com/oauth/authorize
  token_endpoint: null
  token_endpoint_note: >-
    Not published. Probed https://hevy.com/oauth/token and https://hevy.com/api/oauth/token on
